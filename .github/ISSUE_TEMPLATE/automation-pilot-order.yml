name: Automation Pilot — Request or Reserve
description: Request a scoped ¥49,000 pilot and choose full payment or a ¥9,800 fitted-slot reservation.
title: "[Pilot order request] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        # Fixed-Scope AI Workflow Automation Pilot — Request or Reserve
        Use this form to request one **¥49,000 fixed-price pilot** for one repetitive digital workflow. After written fit confirmation, choose full payment or a **¥9,800 fitted-slot reservation** that is fully credited to the total, leaving ¥39,200.

        **Public form:** do not post employer/customer confidential information, personal data, credentials, API keys, private URLs, proprietary documents, production records, or other sensitive information. Use synthetic, public, or generic examples only.

        Submitting this form is non-binding and does not create a purchase, contract, reservation, invoice, or guarantee of acceptance. No payment is requested until fit and scope are confirmed in writing.
  - type: input
    id: roi_issue
    attributes:
      label: ROI Assessment issue URL
      description: Paste the public ROI Assessment issue URL if you already submitted one. If not, enter "none".
      placeholder: https://github.com/Hirokimm/ai-tool-lab/issues/...
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: One workflow to automate
      description: Describe one repetitive digital workflow generically, without confidential details.
      placeholder: "Example: Each week, transform a standardized CSV export into a formatted summary table."
    validations:
      required: true
  - type: input
    id: frequency
    attributes:
      label: Approximate runs per month
      placeholder: "20"
    validations:
      required: true
  - type: input
    id: current_minutes
    attributes:
      label: Current minutes per run
      placeholder: "30"
    validations:
      required: true
  - type: input
    id: target_minutes
    attributes:
      label: Target minutes per run
      placeholder: "5"
    validations:
      required: true
  - type: textarea
    id: testable_output
    attributes:
      label: Testable output and definition of done
      description: State what output can be checked objectively at acceptance.
      placeholder: "Given the agreed synthetic sample, produce the expected table with all required columns and no manual reformatting."
    validations:
      required: true
  - type: dropdown
    id: test_data
    attributes:
      label: Safe test data available
      options:
        - Synthetic example I can provide publicly
        - Public data/source
        - Generic sample can be created without private information
        - Not yet
    validations:
      required: true
  - type: dropdown
    id: payment_path
    attributes:
      label: Preferred payment path after written fit confirmation
      description: This selection records intent only. It does not charge or reserve a slot.
      options:
        - ¥9,800 fitted-slot reservation, fully credited; ¥39,200 remaining
        - ¥49,000 full payment after scope acceptance
        - Need the written scope first, then decide
    validations:
      required: true
  - type: dropdown
    id: discovery_source
    attributes:
      label: How did you reach this order form?
      description: Used to attribute the transaction path.
      options:
        - Direct / AI Tool Lab website
        - Referral partner
        - GitHub or public repository
        - Search
        - Other public source
    validations:
      required: true
  - type: input
    id: referral_code
    attributes:
      label: Referral partner code (if applicable)
      description: If a partner introduced this offer, enter the attribution code they provided. Leave blank for direct orders.
      placeholder: "Example: partner-name-01"
    validations:
      required: false
  - type: checkboxes
    id: commercial_ack
    attributes:
      label: Commercial fit
      options:
        - label: I understand the total pilot price is ¥49,000 fixed for one accepted bounded workflow.
          required: true
        - label: I understand the ¥9,800 reservation is available only after written fit confirmation and is credited to the total.
          required: true
        - label: I understand out-of-scope additions require a separate scope.
          required: true
        - label: I have not included confidential, personal, credential, proprietary, or production information in this public request.
          required: true
  - type: markdown
    attributes:
      value: |
        Live offer and reservation terms: https://github.com/Hirokimm/ai-tool-lab/issues/23

        Full package details: https://github.com/Hirokimm/ai-tool-lab/blob/main/offers/ai-workflow-roi-calculator/IMPLEMENTATION-OFFER.md
