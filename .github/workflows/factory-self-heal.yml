name: Factory Self-Heal First Aid

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: factory-self-heal-first-aid
  cancel-in-progress: false

jobs:
  first-aid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retry fresh failures once and deduplicate escalation
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const SELF = 'Factory Self-Heal First Aid';
            const now = Date.now();
            const horizonMs = 3 * 60 * 60 * 1000;

            const {data} = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, status: 'failure', per_page: 50
            });

            const latestByWorkflow = new Map();
            for (const run of data.workflow_runs || []) {
              if (run.name === SELF) continue;
              const t = Date.parse(run.updated_at || run.created_at || 0);
              if (!Number.isFinite(t) || now - t > horizonMs) continue;
              if (!latestByWorkflow.has(run.workflow_id)) latestByWorkflow.set(run.workflow_id, run);
            }

            const actions = [];
            for (const run of latestByWorkflow.values()) {
              const fingerprint = [run.workflow_id, run.head_sha, run.name].join(':');

              if ((run.run_attempt || 1) < 2) {
                try {
                  await github.rest.actions.reRunWorkflowFailedJobs({
                    owner, repo, run_id: run.id
                  });
                  actions.push(`rerun failed jobs: ${run.name} #${run.run_number} run=${run.id}`);
                  continue;
                } catch (e) {
                  actions.push(`rerun request failed: ${run.name} run=${run.id}: ${e.message}`);
                }
              }

              const title = `[SELF-HEAL] ${run.name}`;
              const marker = `<!-- factory-self-heal-fingerprint:${fingerprint} -->`;
              const body = [
                marker,
                'Factory-wide first aid could not recover this failure with one safe retry.',
                '',
                `Repository: ${owner}/${repo}`,
                `Workflow: ${run.name}`,
                `Run: ${run.html_url}`,
                `Run ID: ${run.id}`,
                `Attempt: ${run.run_attempt || 1}`,
                `Commit: ${run.head_sha}`,
                '',
                'Next owner: HQ self-heal controller. Diagnose logs, make the smallest reversible fix, rerun, verify green, then sync the central ledger.',
              ].join('\n');

              const {data: issues} = await github.rest.issues.listForRepo({
                owner, repo, state: 'open', per_page: 100
              });
              const existing = issues.find(i => !i.pull_request && i.title === title);
              if (existing) {
                const {data: comments} = await github.rest.issues.listComments({
                  owner, repo, issue_number: existing.number, per_page: 100
                });
                const already = [existing.body || '', ...comments.map(c => c.body || '')]
                  .some(x => x.includes(marker));
                if (!already) {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: existing.number, body
                  });
                  actions.push(`escalated new fingerprint to #${existing.number}: ${run.name}`);
                }
              } else {
                const created = await github.rest.issues.create({
                  owner, repo, title, body, assignees: [owner]
                });
                actions.push(`opened #${created.data.number}: ${run.name}`);
              }
            }

            core.summary
              .addHeading('Factory Self-Heal First Aid')
              .addRaw(actions.length ? actions.map(x => `- ${x}`).join('\n') : 'No fresh failed workflows requiring action.')
              .write();
            console.log(JSON.stringify({actions}, null, 2));
