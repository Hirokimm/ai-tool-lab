name: Owned Media Publisher

on:
  pull_request:
    paths:
      - "scripts/owned_publisher.py"
      - "tests/test_owned_publisher.py"
      - "data/owned_manifest_seed.json"
      - ".github/workflows/owned-publisher.yml"
  push:
    branches: [main]
    paths:
      - "scripts/owned_publisher.py"
      - "tests/test_owned_publisher.py"
      - "data/owned_manifest_seed.json"
      - ".github/workflows/owned-publisher.yml"
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: owned-media-publisher
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Test publisher
        run: python -m unittest tests/test_owned_publisher.py -v

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Pull central manifest or bounded seed fallback and render due owned content
        run: python scripts/owned_publisher.py
      - name: Persist published content and receipts
        run: |
          if [ -z "$(git status --porcelain -- insights data/owned_publish_receipts.json)" ]; then
            echo "No owned-media state change"
            exit 0
          fi
          git config user.name "factory-owned-publisher"
          git config user.email "factory-owned-publisher@users.noreply.github.com"
          git add insights data/owned_publish_receipts.json
          git commit -m "chore(owned): publish manifest content"
          git push
