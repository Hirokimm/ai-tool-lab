<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Workflow ROI Calculator</title><style>body{font-family:system-ui;max-width:720px;margin:40px auto;padding:0 18px;line-height:1.5}label{display:block;margin:14px 0}input{width:100%;padding:10px;box-sizing:border-box}button{padding:11px 16px;margin-top:10px}#r{margin-top:22px;padding:18px;border:1px solid #bbb;border-radius:10px}.small{font-size:.9em;color:#555}</style></head><body><h1>AI Workflow ROI Calculator</h1><p>Estimate the value of automating one repetitive knowledge-work workflow. No data leaves your browser.</p><label>Runs per month<input id="runs" type="number" min="0" value="40"></label><label>Minutes per run now<input id="before" type="number" min="0" value="20"></label><label>Minutes per run after automation<input id="after" type="number" min="0" value="5"></label><label>Loaded hourly cost (¥)<input id="rate" type="number" min="0" value="3000"></label><label>One-time implementation cost (¥)<input id="cost" type="number" min="0" value="50000"></label><button onclick="calc()">Calculate</button><div id="r">Enter your numbers and calculate.</div><p class="small">This is a planning estimate, not a guaranteed saving. Validate with a small reversible trial before wider rollout.</p><script>function n(id){return Math.max(0,Number(document.getElementById(id).value)||0)}function yen(x){return new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(x)}function calc(){let runs=n('runs'),b=n('before'),a=n('after'),rate=n('rate'),cost=n('cost'),hrs=runs*Math.max(0,b-a)/60,monthly=hrs*rate,pay=monthly>0?cost/monthly:Infinity,annual=monthly*12-cost;document.getElementById('r').innerHTML='<b>Estimated monthly time saved:</b> '+hrs.toFixed(1)+' hours<br><b>Estimated monthly value:</b> '+yen(monthly)+'<br><b>Estimated payback:</b> '+(isFinite(pay)?pay.toFixed(1)+' months':'N/A')+'<br><b>Estimated first-year net value:</b> '+yen(annual)+'<hr><b>Next step:</b> Pick one low-risk workflow, measure a baseline, run a bounded trial, and compare actual results.'}</script></body></html>
