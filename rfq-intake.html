<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI・自動化 RFQ｜無料で要件を掲載</title><meta name="description" content="AI・業務自動化の導入要件を無料で送信。適合する提供者・ツール候補との接続を検討します。"><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:60px auto;padding:0 20px;line-height:1.7;color:#171717}h1{font-size:2rem}a.cta{display:inline-block;padding:14px 20px;background:#111;color:#fff;text-decoration:none;border-radius:10px}section{margin:32px 0;padding:22px;background:#f5f5f5;border-radius:14px}.small{font-size:.9rem;color:#555}</style></head><body><h1>AI・自動化 RFQ</h1><p>「この作業を自動化したい」「この条件のAIツールを探している」という要件を無料で受け付けます。要件に合うツール、提供者、実装方法が見つかる場合に候補を整理します。</p><section><strong>対象</strong><p>生成AI活用、定型業務の自動化、API連携、データ処理、社内ワークフロー改善など。</p></section><section><strong>費用</strong><p>要件送信は無料です。契約・購入が必要になる場合は、条件を確認したうえで当事者間で判断してください。</p></section><p><a class="cta" href="/buyer-match.html">無料で要件を送る →</a></p><p class="small">勤務先・顧客・船舶その他の機密情報、個人情報、認証情報は送信しないでください。送信は契約や購入を義務付けるものではありません。</p></body></html>
